<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Digital Document Scanner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #12181f; color: #e6e9ee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
      .navbar { background: #0b0f14 !important; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .card-panel { background: #1a222c; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.9rem; }
      .form-control, .form-select { background: #0f151c; border-color: rgba(255,255,255,0.14); color: #e6e9ee; }
      .form-control:focus, .form-select:focus { background: #0f151c; color: #e6e9ee; border-color: #4dabf7; box-shadow: 0 0 0 0.2rem rgba(77,171,247,.25); }
      .btn-scan { background: #4dabf7; border: none; color: #06121f; font-weight: 700; }
      .btn-scan:hover { background: #3a97e6; color: #06121f; }
      .result-img { max-width: 100%; border-radius: 0.6rem; border: 1px solid rgba(255,255,255,0.12); background: #fff; }
      .drop-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 0.75rem; padding: 2rem; text-align: center; cursor: pointer; transition: border-color .15s ease; }
      .drop-zone:hover, .drop-zone.dragover { border-color: #4dabf7; }
    </style>
  </head>
  <body>
    <nav class="navbar py-3 mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1 text-white">📄 Digital Document Scanner</span>
      </div>
    </nav>
    <main class="container pb-5">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
